name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest ruff numpy pillow

      - name: Run tests
        run: python -m pytest tests/test_risk.py tests/test_basic.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run linter
        run: python -m ruff check app tests --select=E,F,I,W
